<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروستکەری فایلی Python بۆ iSH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background-color: #1e293b; width: 100%; max-width: 700px; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
    h1 { text-align: center; color: #38bdf8; font-size: 20px; margin-bottom: 15px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #cbd5e1; font-size: 13px; }
    input[type="text"], textarea { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; font-size: 14px; outline: none; }
    textarea { min-height: 100px; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-generate { background: #38bdf8; color: #0f172a; }
    .btn-copy { background: #22c55e; color: #fff; margin-top: 10px; }
    .btn-ish { background: #eab308; color: #0f172a; margin-top: 10px; }

    .output-box { display: none; margin-top: 15px; }
    pre { background: #090d16; padding: 12px; border-radius: 8px; border: 1px solid #334155; color: #38bdf8; font-size: 13px; overflow-x: auto; direction: ltr; text-align: left; white-space: pre-wrap; }
    .info-note { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px dashed #eab308; margin-top: 10px; font-size: 12px; color: #facc15; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🐍 دروستکەری کۆدی Python بۆ iSH</h1>

    <div class="form-group">
      <label>📝 ناوی فایلی پایتۆن (.py):</label>
      <input type="text" id="fileName" value="aran.py">
    </div>

    <div class="form-group">
      <label>💡 داواکارییەکەت بە کوردی بنووسە:</label>
      <textarea id="prompt" placeholder="داواکاری بنووسە..."></textarea>
    </div>

    <button class="btn btn-generate" onclick="generateCode()">⚡ دروستکردنی کۆد</button>

    <div class="output-box" id="outputBox">
      <label>💻 کۆدی دروستکراو:</label>
      <pre><code id="codeResult"></code></pre>
      
      <button class="btn btn-copy" onclick="copyCode()">📋 کۆپیکردنی کۆدەکە</button>
      <button class="btn btn-ish" onclick="copyIshCommand()">🚀 کۆپیکردنی فەرمانی دروستکردنی فایل لە iSH</button>

      <div class="info-note">
        تێبینی ئایفۆن: ئەگەر داگرتنی فایلەکە سەیڤ نەبوو، کلیک لە دوگمەی زەرد (فەرمانی iSH) بکە و بڕۆ ناو iSH تەنها Pasteی بکە!
      </div>
    </div>
  </div>

  <script>
    function generateCode() {
      const promptText = document.getElementById('prompt').value.trim();
      if (!promptText) return alert("تکایە داواکاری بنووسە!");

      let code = `#!/usr/bin/env python3\n` +
                 `# -*- coding: utf-8 -*-\n` +
                 `import os\n\n` +
                 `def main():\n` +
                 `    os.system('clear')\n` +
                 `    RED = "\\033[1;31m"\n` +
                 `    RESET = "\\033[0m"\n` +
                 `    print(f"{RED}کۆدەکەت لە iSH بە سەرکەوتوویی ڕان بوو!{RESET}")\n` +
                 `    print(f"داواکاری: ${promptText}")\n\n` +
                 `if __name__ == "__main__":\n` +
                 `    main()\n`;

      document.getElementById('codeResult').textContent = code;
      document.getElementById('outputBox').style.display = "block";
    }

    function copyCode() {
      const code = document.getElementById('codeResult').textContent;
      navigator.clipboard.writeText(code);
      alert("✅ کۆدەکە کپی کرا!");
    }

    function copyIshCommand() {
      const code = document.getElementById('codeResult').textContent;
      let fileName = document.getElementById('fileName').value.trim() || "aran.py";
      
      // دروستکردنی فەرمانێکی تەواو بۆ دروستکردنی فایلی py لە iSH تەنها بە یەک پێست
      const ishCommand = `cat << 'EOF' > ${fileName}\n${code}\nEOF\npython3 ${fileName}\n`;
      navigator.clipboard.writeText(ishCommand);
      alert(`✅ فەرمانی iSH کۆپی کرا!\nچۆن بەکاری بێنیت: ڕاستەوخۆ لە ناو ئەپی iSH کلیک لە Paste بکە و ئینتەر لێبدە.`);
    }
  </script>

</body>
</html>
