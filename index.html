<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Downloader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:95%;
max-width:500px;
background:#1e293b;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,.5);
}

h1{
color:#fff;
margin-bottom:10px;
}

p{
color:#cbd5e1;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
outline:none;
font-size:16px;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

.icons{
margin-top:25px;
font-size:35px;
display:flex;
justify-content:center;
gap:18px;
}

.status{
margin-top:20px;
color:#22c55e;
font-size:15px;
}
</style>

</head>
<body>

<div class="box">

<h1>Social Media Downloader</h1>

<p>Paste your video link below</p>

<input
id="url"
type="text"
placeholder="https://...">

<button onclick="downloadVideo()">
Download
</button>

<div class="icons">
🎵 📸 📘 👻
</div>

<div class="status" id="status"></div>

</div>

<script>

async function downloadVideo(){

const url=document.getElementById("url").value;

if(url==""){
alert("Enter video link");
return;
}

document.getElementById("status").innerHTML="Processing...";

const res=await fetch("/download",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
url:url
})

});

const data=await res.json();

document.getElementById("status").innerHTML=data.message;

if(data.download){

window.location=data.download;

}

}

</script>

</body>
</html>
