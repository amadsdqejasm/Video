<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دەستکاریکردنی ڤیدیۆی ڕۆناڵدۆ بە دەنگی خۆی</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      width: 100%;
      max-width: 650px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #38bdf8;
      font-size: 24px;
    }

    .section {
      background-color: #0f172a;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #1e293b;
    }

    .section h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #94a3b8;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #1e293b;
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }

    .advice-box {
      direction: ltr;
      text-align: left;
      background: #1e1b4b;
      border-left: 4px solid #818cf8;
      padding: 15px;
      border-radius: 8px;
    }

    .advice-box p {
      color: #c7d2fe;
      font-style: italic;
      font-size: 15px;
      line-height: 1.5;
    }

    .filter-options {
      display: flex;
      gap: 10px;
    }

    .btn-filter {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #334155;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-filter.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .video-container {
      width: 100%;
      max-height: 380px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      margin-top: 15px;
    }

    video {
      width: 100%;
      max-height: 350px;
      display: block;
      transition: filter 0.3s ease;
    }

    .btn-action {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-play {
      background-color: #eab308;
      color: #000;
    }

    .btn-download {
      background-color: #22c55e;
      color: #fff;
    }

    /* فلتەرەکانی دیزاین */
    .filter-dark { filter: brightness(0.55) contrast(1.2); }
    .filter-bright { filter: brightness(1.35) contrast(1.1); }
    .filter-4k { filter: brightness(1.05) contrast(1.3) saturate(1.3); }
  </style>
</head>
<body>

  <div class="container">
    <h1>دەستکاریکردنی ڤیدیۆ بە دەنگی ڕۆناڵدۆ</h1>

    <!-- فەراخی یەکەم: ڤیدیۆ + فایلی دەنگی ڕۆناڵدۆ -->
    <div class="section">
      <h3>فەراخی ١: ڤیدیۆکەی ڕۆناڵدۆ بێنە</h3>
      <input type="file" id="videoInput" accept="video/*">
      
      <h3 style="margin-top: 15px;">بارکردنی دەنگی ڕۆناڵدۆ (MP3):</h3>
      <input type="file" id="audioInput" accept="audio/*">
    </div>

    <!-- فەراخی دووەم: ئامۆژگاری ئینگلیزی -->
    <div class="section">
      <h3>فەراخی ٢: Football Advice</h3>
      <div class="advice-box">
        <p>"Your love makes me strong, your hate makes me unstoppable. Work hard every day and keep your dreams alive."</p>
      </div>
    </div>

    <!-- فەراخی سێیەم: دیزاینی ڤیدیۆ -->
    <div class="section">
      <h3>فەراخی ٣: دیزاینی ڤیدیۆ</h3>
      <div class="filter-options">
        <button class="btn-filter" onclick="applyFilter('dark', this)">تاریککردن</button>
        <button class="btn-filter" onclick="applyFilter('bright', this)">ڕوونکردنەوە</button>
        <button class="btn-filter" onclick="applyFilter('4k', this)">کوالێتی 4K</button>
      </div>
    </div>

    <!-- پێشاندان -->
    <div class="section" id="previewSection" style="display: none;">
      <h3>پێشاندان:</h3>
      <div class="video-container">
        <!-- ڤیدیۆکە Mute کراوە بۆ ئەوەی دەنگی ڕەسەنی نەیێت -->
        <video id="ronaldoVideo" muted playsinline></video>
      </div>
      
      <button class="btn-action btn-play" onclick="playVideoWithRonaldoVoice()">▶️ لێدانی ڤیدیۆ بە دەنگی ڕاستەقینەی ڕۆناڵدۆ</button>
      <button class="btn-action btn-download" onclick="downloadVideo()">📥 داگرتنی یەکسەر (Download)</button>
    </div>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const audioInput = document.getElementById('audioInput');
    const ronaldoVideo = document.getElementById('ronaldoVideo');
    const previewSection = document.getElementById('previewSection');

    let videoFileUrl = '';
    // دەتوانیت ناو یان لینکێکی ئامادەکراوی MP3ی دەنگی ڕۆناڵدۆ لێرە دابنێیت
    let ronaldoAudio = new Audio('ronaldo-voice.mp3'); 

    // بارکردنی فایلی ڤیدیۆ
    videoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        videoFileUrl = URL.createObjectURL(file);
        ronaldoVideo.src = videoFileUrl;
        ronaldoVideo.muted = true; // دەنگی ناو ڤیدیۆکە میوت دەکرێت
        previewSection.style.display = 'block';
      }
    });

    // بارکردنی فایلی دەنگی تایبەت بە ڕۆناڵدۆ (ئەگەر لە ئامێرەکەت هەتبێت)
    audioInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const audioUrl = URL.createObjectURL(file);
        ronaldoAudio = new Audio(audioUrl);
      }
    });

    // گۆڕینی دیزاین
    function applyFilter(filterType, btn) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      ronaldoVideo.className = '';
      if (filterType === 'dark') ronaldoVideo.classList.add('filter-dark');
      if (filterType === 'bright') ronaldoVideo.classList.add('filter-bright');
      if (filterType === '4k') ronaldoVideo.classList.add('filter-4k');
    }

    // لێدانی هاوکاتی دەنگ و ڤیدیۆکە
    function playVideoWithRonaldoVoice() {
      // ڕاگرتن و سەرلەنوێ دەستپێکردنەوەی دەنگ و ڤیدیۆ
      ronaldoAudio.pause();
      ronaldoAudio.currentTime = 0;
      ronaldoVideo.currentTime = 0;

      // لێدانی هەردووکیان پێکەوە
      ronaldoAudio.play();
      ronaldoVideo.play();

      // کاتێک دەنگەکە تەواو بوو، ڤیدیۆکەش بوەستێت
      ronaldoAudio.onended = () => {
        ronaldoVideo.pause();
      };
    }

    // داگرتن
    function downloadVideo() {
      if (!videoFileUrl) return;
      const a = document.createElement('a');
      a.href = videoFileUrl;
      a.download = `ronaldo-voice-edited-${Date.now()}.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

</body>
</html>
