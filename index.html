<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروستکەری فایلی Python بۆ iSH Shell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background-color: #1e293b; width: 100%; max-width: 750px; padding: 25px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { text-align: center; margin-bottom: 8px; color: #38bdf8; font-size: 22px; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
    input[type="text"], textarea { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; font-size: 14px; outline: none; transition: border 0.3s; }
    input[type="text"]:focus, textarea:focus { border-color: #38bdf8; }
    textarea { resize: vertical; min-height: 110px; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.3s ease; }
    .btn-generate { background: #38bdf8; color: #0f172a; margin-bottom: 15px; }
    .btn-generate:hover { background: #0284c7; color: #fff; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn-download { background: #22c55e; color: #fff; flex: 1; }
    .btn-download:hover { background: #16a34a; }
    .btn-copy { background: #eab308; color: #0f172a; flex: 1; }
    .btn-copy:hover { background: #ca8a04; color: #fff; }

    .output-box { display: none; margin-top: 20px; }
    .code-container { position: relative; background: #090d16; border-radius: 8px; border: 1px solid #334155; overflow: hidden; }
    pre { padding: 15px; color: #38bdf8; font-family: 'Courier New', Courier, monospace; font-size: 13px; overflow-x: auto; white-space: pre-wrap; direction: ltr; text-align: left; }
    
    .api-setup { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px dashed #334155; margin-bottom: 15px; }
    .status { margin-top: 10px; font-size: 13px; text-align: center; color: #f59e0b; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🐍 دروستکەری فایلی Python بۆ iSH Shell</h1>
    <p class="subtitle">داواکارییەکەت بە کوردی بنووسە تا فایلی پایتۆنت بۆ دروست بکات</p>

    <!-- کلیلی Gemini API -->
    <div class="api-setup">
      <label for="apiKey">🔑 کلیلی Gemini API (ئارەزوومەندانەیە):</label>
      <input type="text" id="apiKey" placeholder="کلیلی API لێرە دابنێ...">
    </div>

    <!-- ناوی فایلی پایتۆن -->
    <div class="form-group">
      <label for="fileName">📝 ناوی فایلی پایتۆن (.py):</label>
      <input type="text" id="fileName" value="aran.py" placeholder="نموونە: aran.py">
    </div>

    <!-- بەشی نووسینی داواکاری -->
    <div class="form-group">
      <label for="prompt">💡 داواکارییەکەت بە کوردی بنووسە:</label>
      <textarea id="prompt" placeholder="نموونە: کۆدێکم بۆ بنووسە کە ناوی من بە ڕەنگی سوور نیشان بدات..."></textarea>
    </div>

    <button class="btn btn-generate" onclick="generateCode()">⚡ دروستکردنی کۆدی Python</button>
    <div class="status" id="statusMsg"></div>

    <!-- بەشی پێشاندانی کۆد و دوگمەکان -->
    <div class="output-box" id="outputBox">
      <label>💻 کۆدی دروستکراو:</label>
      <div class="code-container">
        <pre><code id="codeResult"></code></pre>
      </div>
      
      <div class="btn-group">
        <button class="btn btn-download" onclick="downloadPyFile()">📥 داگرتنی فایل (.py)</button>
        <button class="btn btn-copy" onclick="copyCode()">📋 کۆپیکردنی کۆد</button>
      </div>
    </div>
  </div>

  <script>
    async function generateCode() {
      const promptText = document.getElementById('prompt').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const statusMsg = document.getElementById('statusMsg');
      const outputBox = document.getElementById('outputBox');
      const codeResult = document.getElementById('codeResult');

      if (!promptText) {
        alert("تکایە سەرەتا داواکارییەکەت بە کوردی بنووسە!");
        return;
      }

      statusMsg.innerText = "⏳ چاوەڕێ بکە... کۆدەکە ئامادە دەکرێت...";
      outputBox.style.display = "none";

      if (apiKey) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Create a fully working Python 3 script compatible with iSH Shell / Linux. Start with #!/usr/bin/env python3. Output ONLY raw executable python code without any markdown tags. Request: ${promptText}`
                }]
              }]
            })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            let code = data.candidates[0].content.parts[0].text;
            code = code.replace(/```python/g, '').replace(/```/g, '').trim();
            showResult(code);
            return;
          }
        } catch (err) {
          console.error(err);
        }
      }

      setTimeout(() => {
        let generatedPython = generateLocalPython(promptText);
        showResult(generatedPython);
      }, 300);
    }

    function generateLocalPython(userPrompt) {
      return `#!/usr/bin/env python3\n` +
             `# -*- coding: utf-8 -*-\n` +
             `# فایلی دروستکراو بۆ iSH Shell\n` +
             `# داواکاری: "${userPrompt}"\n\n` +
             `import os\n` +
             `import sys\n\n` +
             `def main():\n` +
             `    os.system('clear')\n` +
             `    RED = "\\033[1;31m"\n` +
             `    RESET = "\\033[0m"\n\n` +
             `    print(f"{RED}======================================{RESET}")\n` +
             `    print(f"{RED}   کۆدی پایتۆن لە iSH بە سەرکەوتوویی ڕان بوو   {RESET}")\n` +
             `    print(f"{RED}======================================{RESET}\\n")\n` +
             `    print(f"داواکارییەکەت: {userPrompt}")\n` +
             `    print("\\n[+] کارەکە تەواو بوو!")\n\n` +
             `if __name__ == "__main__":\n` +
             `    main()\n`;
    }

    function showResult(code) {
      document.getElementById('codeResult').textContent = code;
      document.getElementById('statusMsg').innerText = "✨ کۆدەکە ئامادەیە!";
      document.getElementById('outputBox').style.display = "block";
    }

    // ڕێگەی داگرتن بە فۆرماتی Base64 (بۆ تێپەڕاندنی بلۆکی iOS Safari)
    function downloadPyFile() {
      const code = document.getElementById('codeResult').textContent;
      let fileName = document.getElementById('fileName').value.trim() || "aran.py";
      if (!fileName.endsWith('.py')) fileName += ".py";

      try {
        const base64Data = btoa(unescape(encodeURIComponent(code)));
        const dataUrl = 'data:application/octet-stream;charset=utf-8;base64,' + base64Data;
        
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        alert("داگرتنی ڕاستەوخۆ لەلایەن ئایفۆنەوە بلۆک کراوە. تکایە دوگمەی 'کۆپیکردنی کۆد' بەکاربێنە!");
      }
    }

    // کاتێک داگرتن کار ناکات، ئەم دوگمەیە ١٠٠٪ لەسەر ئایفۆن کار دەکات
    function copyCode() {
      const code = document.getElementById('codeResult').textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert("✅ کۆدەکە کپی کرا! ئێستا بڕۆ ناو ئەپی iSH Shell و پێستی بکە.");
      }).catch(() => {
        alert("کۆپیکردن سەرکەوتوو نەبوو.");
      });
    }
  </script>

</body>
</html>
