<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4K Ultra HD Video & Photo Studio - یدیتکردنی پرۆفێشناڵی 4K</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Anton&family=Bebas+Neue&family=Cairo:wght@400;700;900&family=Changa:wght@400;700;800&family=Montserrat:wght@400;700;900&family=Outfit:wght@400;700;900&family=Permanent+Marker&family=Playfair+Display:wght@700;900&family=Poppins:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', 'Tajawal', Tahoma, sans-serif; background-color: #030712; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Presets Definition
    const PRESETS = [
      { id: '4k-portrait', name: '4K Portrait Glow (پێستی لوس)', brightness: 104, contrast: 128, saturate: 115, sharpness: 80, hdr: 65, smooth: 45, vignette: 35 },
      { id: 'capcut-hdr', name: 'CapCut 4K HDR Crisp', brightness: 105, contrast: 135, saturate: 125, sharpness: 90, hdr: 40, smooth: 20, vignette: 20 },
      { id: 'alight-motion', name: 'Alight Motion CC Dark', brightness: 98, contrast: 140, saturate: 130, sharpness: 85, hdr: 70, smooth: 30, vignette: 45 },
      { id: 'cyber-neon', name: 'Cyberpunk Neon 4K', brightness: 108, contrast: 125, saturate: 145, sharpness: 75, hdr: 80, smooth: 10, vignette: 30 },
      { id: 'beauty-skin', name: 'Beauty Smooth Skin', brightness: 106, contrast: 108, saturate: 105, sharpness: 45, hdr: 55, smooth: 80, vignette: 15 }
    ];

    function App() {
      const [mediaSrc, setMediaSrc] = useState(null);
      const [mediaType, setMediaType] = useState('image');
      const [activePreset, setActivePreset] = useState(PRESETS[0]);
      const [brightness, setBrightness] = useState(104);
      const [contrast, setContrast] = useState(128);
      const [saturate, setSaturate] = useState(115);
      const [textOverlays, setTextOverlays] = useState([]);
      const [newText, setNewText] = useState('');
      const [selectedFont, setSelectedFont] = useState('Tajawal');
      const [selectedAnim, setSelectedAnim] = useState('pop');
      const canvasRef = useRef(null);
      const videoRef = useRef(null);
      const imageRef = useRef(null);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const isVid = file.type.startsWith('video/');
        const url = URL.createObjectURL(file);
        setMediaType(isVid ? 'video' : 'image');
        setMediaSrc(url);
      };

      const handleApplyPreset = (p) => {
        setActivePreset(p);
        setBrightness(p.brightness);
        setContrast(p.contrast);
        setSaturate(p.saturate);
      };

      const handleAddText = () => {
        if (!newText.trim()) return;
        setTextOverlays([...textOverlays, {
          id: Date.now(),
          text: newText,
          x: 50,
          y: 50,
          fontFamily: selectedFont,
          animation: selectedAnim
        }]);
        setNewText('');
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const source = mediaType === 'video' ? videoRef.current : imageRef.current;
        if (!source) return;

        let animId;
        let startTime = Date.now();

        const render = () => {
          const currentTime = (Date.now() - startTime) / 1000;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.filter = 'brightness(' + brightness + '%) contrast(' + contrast + '%) saturate(' + saturate + '%)';

          ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
          ctx.filter = 'none';

          // Text overlays rendering with animations
          textOverlays.forEach(t => {
            ctx.save();
            let py = (t.y / 100) * canvas.height;
            let px = (t.x / 100) * canvas.width;

            if (t.animation === 'bounce') {
              py += Math.sin(currentTime * 6) * 15;
            } else if (t.animation === 'wave') {
              py += Math.sin(currentTime * 4) * 10;
            }

            ctx.font = 'bold 42px ' + (t.fontFamily || 'Tajawal') + ', Montserrat, sans-serif';
            ctx.fillStyle = '#00F0FF';
            ctx.shadowColor = '#0033FF';
            ctx.shadowBlur = 15;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.text, px, py);
            ctx.restore();
          });

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [mediaSrc, mediaType, brightness, contrast, saturate, textOverlays]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/90 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center space-x-3 rtl:space-x-reverse">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-600 flex items-center justify-center font-black text-slate-950">4K</div>
              <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-fuchsia-400 bg-clip-text text-transparent">4K Ultra HD Video Editor</h1>
            </div>
            <label className="cursor-pointer px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-cyan-500/20">
              دابەزاندنی فایل (Video/Photo)
              <input type="file" accept="video/*,image/*" onChange={handleFileUpload} className="hidden" />
            </label>
          </header>

          {/* Main Layout */}
          <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
            {/* Canvas Preview */}
            <div className="flex-1 p-6 flex flex-col items-center justify-center bg-slate-950 relative">
              {mediaSrc ? (
                <div className="relative max-h-[70vh] rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
                  <canvas ref={canvasRef} width={1080} height={1920} className="max-h-[68vh] w-auto bg-black rounded-2xl" />
                </div>
              ) : (
                <div className="text-center p-12 border-2 border-dashed border-slate-800 rounded-3xl max-w-md">
                  <p className="text-slate-400 text-sm mb-4">فایلی MP4, MOV یان JPG, PNG دابنێ بۆ دەستکاری لەگەڵ فلتەری 4K</p>
                  <label className="cursor-pointer px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-sm">
                    دیاریکردنی فایل
                    <input type="file" accept="video/*,image/*" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>
              )}
              {mediaType === 'video' && mediaSrc && <video ref={videoRef} src={mediaSrc} className="hidden" autoPlay loop muted />}
              {mediaType === 'image' && mediaSrc && <img ref={imageRef} src={mediaSrc} className="hidden" />}
            </div>

            {/* Sidebar Controls */}
            <div className="w-full md:w-80 border-t md:border-t-0 md:border-r border-slate-800 bg-slate-900/80 p-5 overflow-y-auto space-y-6">
              <div>
                <h3 className="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-3">فلتەرەکانی 4K Ultra HD</h3>
                <div className="grid grid-cols-1 gap-2">
                  {PRESETS.map(p => {
                    const isAct = activePreset.id === p.id;
                    const btnClass = isAct ? "bg-cyan-500/20 border-cyan-400 text-cyan-300" : "bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800";
                    return (
                      <button key={p.id} onClick={() => handleApplyPreset(p)} className={"p-3 rounded-xl border text-right transition-all text-xs font-bold " + btnClass}>
                        {p.name}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div>
                <h3 className="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-3">زیادکردنی تێکست (Text & Animations)</h3>
                <div className="space-y-2">
                  <input type="text" value={newText} onChange={e => setNewText(e.target.value)} placeholder="نوسین بنووسە..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                  
                  <div className="flex gap-2">
                    <select value={selectedFont} onChange={e => setSelectedFont(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-cyan-300 font-bold">
                      <option value="Tajawal">Tajawal (کوردی)</option>
                      <option value="Cairo">Cairo (کاھیرۆ)</option>
                      <option value="Changa">Changa (تۆخ)</option>
                      <option value="Amiri">Amiri (ڕەسەن)</option>
                      <option value="Montserrat">Montserrat</option>
                      <option value="Bebas Neue">Bebas Neue</option>
                    </select>

                    <select value={selectedAnim} onChange={e => setSelectedAnim(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-cyan-300 font-bold">
                      <option value="bounce">بازدان (Bounce)</option>
                      <option value="wave">شەپۆل (Wave)</option>
                      <option value="pop">تەقینەوە (Pop)</option>
                      <option value="none">سادە</option>
                    </select>
                  </div>

                  <button onClick={handleAddText} className="w-full py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/20">
                    زیادکردنی تێکست بۆسەر ڤیدیۆ
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
