<!doctype html>
<html lang="ckb" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داگرتنی ڤیدیۆی زێرین | TikTok & Instagram Downloader No Watermark</title>
    <meta name="description" content="پلاتفۆرمی زێرین بۆ داگرتنی ڤیدیۆ و ستۆری تیک تۆک و ئینستاگرام بەبێ لوگۆ بە بەرزترین کوالێتی" />
    
    <!-- Google Kurdish Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gold: {
                50: '#fffdf0',
                100: '#fffab8',
                300: '#ffd700',
                500: '#d4af37',
                700: '#b38728',
                900: '#8a6d1c',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Vazirmatn', 'Alexandria', sans-serif;
        background-color: #0b0c10;
        color: #e5e5e5;
      }
      .bg-gold-gradient {
        background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      }
      .text-gold-gradient {
        background: linear-gradient(135deg, #ffd700 0%, #f39c12 50%, #d4af37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .border-gold-glow {
        border: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0f1016; }
      ::-webkit-scrollbar-thumb { background: #2a2618; border-radius: 4px; border: 1px solid rgba(212, 175, 55, 0.3); }
    </style>

    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#0b0c10] text-[#e5e5e5] antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [url, setUrl] = useState('');
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);
        const [error, setError] = useState(null);

        const handleDownload = async (e) => {
          e.preventDefault();
          if (!url.trim()) return;
          setLoading(true);
          setError(null);
          setResult(null);

          try {
            const res = await fetch('/api/fetch-media', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: url.trim() })
            });
            const data = await res.json();
            if (data.success) {
              setResult(data);
            } else {
              setError(data.error || 'کێشەیەک ڕوویدا لە داگرتنی زانیاری ڤیدیۆکە');
            }
          } catch (err) {
            setError('نەتوانرا پەیوەندی بە سێرڤەرەوە بپەیوەسترێت');
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="min-h-screen flex flex-col justify-between p-4 sm:p-8">
            {/* Header */}
            <header className="max-w-6xl mx-auto w-full flex items-center justify-between pb-6 border-b border-[#d4af37]/20">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-xl bg-[#d4af37]/20 border border-[#d4af37] flex items-center justify-center text-[#ffd700] text-2xl font-black">
                  👑
                </div>
                <div>
                  <h1 className="text-2xl font-black text-gold-gradient">داگرتنی ڤیدیۆی زێرین</h1>
                  <p className="text-xs text-amber-200/70">تیک تۆک، ئینستاگرام و ستۆری بەبێ لوگۆ 100%</p>
                </div>
              </div>
              <div className="px-4 py-1.5 rounded-full bg-[#d4af37]/10 border border-[#d4af37]/40 text-[#ffd700] text-xs font-bold">
                سیستەمی خێرا 2026
              </div>
            </header>

            {/* Main Form Section */}
            <main className="max-w-4xl mx-auto w-full my-10">
              <div className="text-center mb-8">
                <h2 className="text-3xl sm:text-5xl font-black text-white mb-3">
                  لینکەکەت دابنێ و <span className="text-gold-gradient">ڤیدیۆکەت بەبێ لوگۆ</span> دابگرە
                </h2>
                <p className="text-gray-400 text-sm">پشتگیری لە TikTok, Instagram, Stories, YouTube Shorts & Facebook</p>
              </div>

              {/* Input Card */}
              <div className="p-1 rounded-3xl bg-gradient-to-r from-[#b38728] via-[#ffd700] to-[#aa771c] shadow-2xl">
                <form onSubmit={handleDownload} className="bg-[#0e1017] rounded-[22px] p-4 sm:p-6 flex flex-col sm:flex-row gap-3">
                  <input
                    type="url"
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    placeholder="لینکی ڤیدیۆ یان ستۆری تیک تۆک / ئینستاگرام دابنێ..."
                    className="flex-1 py-4 px-5 bg-[#161824] rounded-2xl border border-[#d4af37]/30 text-white placeholder-gray-400 font-medium text-sm outline-none text-right"
                    required
                  />
                  <button
                    type="submit"
                    disabled={loading}
                    className="px-8 py-4 rounded-2xl font-extrabold text-[#0b0c10] bg-gradient-to-r from-[#ffd700] to-[#d4af37] hover:brightness-110 active:scale-95 transition shadow-lg shadow-[#d4af37]/30"
                  >
                    {loading ? 'لە کاتی داگرتندا...' : 'داگرتنی ڤیدیۆ'}
                  </button>
                </form>
              </div>

              {error && (
                <div className="mt-4 p-4 rounded-xl bg-red-950/80 border border-red-500/40 text-red-200 text-sm font-semibold text-center">
                  {error}
                </div>
              )}

              {/* Media Result */}
              {result && (
                <div className="mt-10 p-6 rounded-3xl bg-[#12141e] border border-[#d4af37]/30 shadow-2xl">
                  <div className="flex flex-col md:flex-row gap-6 items-center">
                    <div className="w-full md:w-1/3 aspect-[9/16] max-h-80 bg-black rounded-2xl overflow-hidden relative">
                      <video src={result.downloadLinks[0]?.rawUrl || result.downloadLinks[0]?.url} controls className="w-full h-full object-contain" />
                    </div>
                    <div className="w-full md:w-2/3 text-right">
                      <h3 className="text-xl font-black text-white mb-2">{result.title}</h3>
                      <p className="text-xs text-emerald-400 font-bold mb-4">✨ ١٠٠٪ داگرتن بەبێ لوگۆ و وۆتەرمارک</p>

                      <div className="space-y-3">
                        {result.downloadLinks.map((link, idx) => (
                          <div key={idx} className="flex items-center justify-between p-3 rounded-xl bg-[#181b29] border border-[#d4af37]/20">
                            <div>
                              <span className="font-bold text-white text-sm">{link.label}</span>
                              <span className="text-xs text-gray-400 block">{link.quality} • {link.size}</span>
                            </div>
                            <a
                              href={link.url}
                              download
                              className="px-4 py-2 rounded-xl bg-gradient-to-r from-[#ffd700] to-[#d4af37] text-[#0b0c10] font-black text-xs"
                            >
                              داگرتن
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="text-center text-xs text-gray-500 pt-8 border-t border-[#d4af37]/15">
              © 2026 داگرتنی ڤیدیۆی زێرین. هەموو مافەکانی پارێزراوە.
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
